<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>LedgerLine status board (sample, test data)</title>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f7f7f5; color: #1c1f24; }
  .banner { padding: 10px 24px; background: #1c1f24; color: #fff; font-size: 14px; }
  main { max-width: 1100px; margin: 0 auto; padding: 40px 24px; }
  h1 { margin: 0 0 24px; font-size: 32px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #dcdcd8; }
  th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid #e6e6e2; }
  th { font-size: 13px; color: #5a5f68; }
</style>
</head>
<body>
<div class="banner">Sample file for layout review</div>
<main>
  <h1>LedgerLine status board (sample, test data)</h1>
  <table>
    <thead><tr><th>Document</th><th>Filed under</th><th>Status</th></tr></thead>
    <tbody>
      <tr><td>Document A</td><td>Folder 1</td><td>Filed</td></tr>
      <tr><td>Document B</td><td>Folder 2</td><td>Filed</td></tr>
      <tr><td>Document C</td><td>Folder 1</td><td>Waiting</td></tr>
      <tr><td>Document D</td><td>Folder 3</td><td>Missing</td></tr>
    </tbody>
  </table>
</main>
</body>
</html>
